[package]
name = "projectx-nt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Independent ProjectX adapter primitives for NautilusTrader-compatible integrations"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "projectx_nt"
crate-type = ["rlib", "cdylib"]

[features]
default = ["high-precision"]
high-precision = ["nautilus-model/high-precision"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-model/extension-module",
  "python",
  "pyo3/extension-module",
]
python = [
  "dep:nautilus-system",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-model/python",
  "nautilus-system/python",
  "pyo3",
  "pyo3-async-runtimes",
  "pyo3-stub-gen",
]

[package.metadata.cargo-machete]
ignored = [
  "nautilus-system",
] # Optional dependency activated only by the python feature

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true, features = ["node"] }
nautilus-model = { workspace = true }
nautilus-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
dashmap = { workspace = true }
jiff = { version = "0.2.35", default-features = false, features = ["perf-inline", "serde", "std", "tzdb-zoneinfo"] }
log = { workspace = true }
parking_lot = "0.12"
projectx-client = "2"
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-backtest = { workspace = true, features = ["streaming"] }
nautilus-indicators = { workspace = true }
nautilus-persistence = { workspace = true }
nautilus-testkit = { workspace = true, features = ["testers"] }
nautilus-trading = { workspace = true }

dotenvy = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
ustr = { workspace = true }

# cargo run --example projectx-rust-quote-probe -p projectx-nt
[[example]]
name = "projectx-rust-quote-probe"
path = "examples/node_quote_probe.rs"
required-features = []
doc = false
test = false

